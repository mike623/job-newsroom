# Job-board crawl configuration.
# Copy to config.yml and edit for your own search. config.yml is gitignored.
# Search-card pages are discovery only; only full-JD records are exported downstream.

profile:
  target_salary_gbp: 60000
  minimum_salary_gbp: 55000
  preferred_locations:
    - remote uk
    - london

search:
  titles:
    primary:
      - senior software engineer
      - backend developer
    secondary:
      - lead software engineer
      - typescript developer
    exploratory:
      - platform engineer
  locations:
    core:
      - london
      - manchester
    extended:
      - birmingham

boards:
  reed:
    enabled: true
    # Egress identities for this board. Empty means one: everything leaves from this
    # machine's IP, so only one worker may crawl this host at a time. Adding proxies here
    # raises that limit — splitting by search term does not, since the rate limit is per IP.
    proxies: []
    title_groups:
      - primary
      - secondary
    location_groups:
      - core
    proximity: 50
    full_jd:
      enabled: true
      top_n: 10            # Slow mode: fewer detail pages per run.
      delay_seconds: 12    # Slow mode: wait between full-JD page crawls.

  totaljobs:
    enabled: true
    title_groups:
      - primary
      - secondary
    location_groups:
      - core
    radius: 30
    full_jd:
      enabled: true
      top_n: 5
      delay_seconds: 20

  indeed:
    # Built/probed, but disabled by default. Indeed is high-friction and some
    # postings are generic/non-live adverts, hence reject_phrases below.
    enabled: false
    title_groups:
      - primary
      - secondary
    location_groups:
      - core
    radius: 50
    full_jd:
      enabled: true
      top_n: 3
      delay_seconds: 30
    reject_phrases:
      - not represent a live vacancy
      - register your interest
      - talent pool
      - no experience needed
      - training programme

  haystack:
    # Aggregator (haystack.cv). Results are rendered client-side and its search backend
    # intermittently errors, so an empty scan is normal rather than a bug. Its free-text
    # search is loose and appears to require every term, so short titles return far more
    # than long ones.
    enabled: true
    title_groups:
      - primary
      - secondary
    location_groups:
      - core

  adzuna:
    # Read from Adzuna's JSON API, not by crawling: adzuna.co.uk answers automated fetches
    # with a CloudFront 403. Credentials are free from developer.adzuna.com; either set them
    # here (config.yml is gitignored) or export ADZUNA_APP_ID / ADZUNA_APP_KEY.
    enabled: false
    app_id: ""
    app_key: ""
    title_groups:
      - primary
      - secondary
    location_groups:
      - core
    distance: 30           # kilometres from the location
    results_per_page: 50   # the API's maximum

  linkedin:
    # Read from LinkedIn's unauthenticated guest endpoint, not by crawling: there is no
    # public job-search API, and logged-in search is hostile to automation. The endpoint
    # returns ten cards per page and refuses to page past start=1000.
    # Off by default — an unauthenticated endpoint throttles by IP, and a block here also
    # costs you the LinkedIn alert mail the email board reads.
    enabled: false
    title_groups:
      - primary
      - secondary
    location_groups:
      - core
    distance: 30           # miles from the location
    max_age_days: 7        # f_TPR freshness filter; without it page one carries stale adverts
    pages_per_search: 1    # ten cards a page; the only cap on this board's request count
    delay_seconds: 60

  careerwallet:
    # thecareerwallet.com renders its search server-side, so a plain GET returns the whole
    # results page — no browser, no API. Its daily alert mail is deliberately not read: every
    # link there is a /stats/jbe/ tracker holding a Laravel-encrypted blob with a fresh IV per
    # send, so the same advert would arrive under a new URL every morning and never dedupe,
    # and robots.txt disallows resolving one. The search is where a posting states its id.
    enabled: false
    title_groups:
      - primary
      - secondary
    location_groups:
      - core
    radius: 40             # miles from the location; the form's own "Radius" field
    pages_per_search: 3    # ~ten cards a page; the only cap on this board's request count
    delay_seconds: 60

  talent:
    # Very low-volume Talent.com search-card discovery.
    # Talent.com can return an unhydrated shell for /jobs?k=...&l=...; supplying a
    # real result `id` from a browser session forces the result list to hydrate.
    enabled: true
    delay_seconds: 60
    search_params:
      - k: Senior Software Engineer
        l: london
        id: "000000000000000000"  # Replace with a live Talent.com result id.
      - k: Lead Software Engineer
        l: london

  email:
    # Not a crawl: the boards already email their alerts, and this reads the Gmail labels
    # they are filed into via the `himalaya` CLI (brew install himalaya, then `himalaya`
    # once to configure the account). The label says where to look, the sender says which
    # URL rules apply, and a body signature says which layout to read — see
    # reed_crawler/email_pipeline.py.
    enabled: false
    messages_per_label: 25   # newest N per label per run
    max_age_days: 14         # ignore mail older than this
    max_urls_per_message: 12 # a digest links its own footer as well as its jobs
    mark_read: false         # flag mail that produced leads as seen, and list only unseen
                             # mail, so each run reads what has arrived since the last one
    labels:
      - label: job/discovery/indeed
        provider: indeed
      - label: job/discovery/linkedin
        provider: linkedin
      - label: job/discovery/totaljobs
        provider: totaljobs
      - label: job/discovery/jobright
        provider: jobright
      - label: job/discovery/haystack
        provider: haystack
      - label: job/discovery/welcometothejungle
        provider: welcometothejungle
      # 24recruitmentmail.com re-mails three boards' adverts — talent.com, joblookup.com and
      # thebigjobsite.com — behind one click wrapper, so the destination decides which board a
      # lead belongs to, not the sender. These digests carry 20 jobs each; raise
      # max_urls_per_message above if you want all of them rather than the first 12.
      - label: job/discovery/job24
        provider: job24

  # --- Aggregator feeds -------------------------------------------------------------
  # One endpoint publishing many companies' postings. Plain HTTP GETs returning JSON or XML,
  # all served by reed_crawler/aggregator_pipeline.py and described in aggregator_feeds.py.
  # They are remote-global where the boards above are UK-specific, so expect most of what
  # they return to be filtered out downstream by career-ops/portals.yml.

  devitjobs:
    # DevITjobs UK publishes its whole board as one XML feed — no query parameters, so a scan
    # takes the feed whole. The only feed of the set quoting pay as prose, so it is the only
    # one salary.py is asked to parse. ~11 MB uncompressed, requested gzipped.
    enabled: false
    max_items: 500         # keep the best-paid N of a large feed

  remoteok:
    # remoteok.com/api returns the latest ~100 remote postings in one array whose first
    # element is the API's legal notice rather than a job. No query parameters at all.
    enabled: false

  themuse:
    # 411,049 postings across 20,553 pages, so `queries` is required and the scan refuses to
    # start without it. These are The Muse's own &category= names, NOT job titles: a title
    # like "senior software engineer" matches nothing, while "Software Engineering" narrows
    # to 100,800. Locations are free text.
    enabled: false
    queries:
      - Software Engineering
    location_groups:
      - core
    pages_per_query: 3
    max_items: 200

crawl:
  delay_seconds: 15              # Slow mode: wait between search pages.
  page_timeout_ms: 60000
  delay_before_return_html_seconds: 10
  scan_full_page: true
  scroll_delay: 1.5
  headless: true

career_ops:
  # The career-ops directory. The dashboard reads it to tell actioned jobs from the rest, and
  # reed_crawler/ingest_jobspy.py appends pipeline entries to it by hand. Editable from the
  # dashboard's /ingest page.
  # Either its checkout or its data directory: career-ops keeps the two apart when a
  # `.career-ops-data` file in the checkout names where the data went, and that is followed
  # here the way career-ops follows it, along with its CAREER_OPS_ROOT / CAREER_OPS_DATA_DIR.
  # Overridable at runtime with the CAREER_OPS_WORKSPACE env var.
  workspace: ../career-ops

# Backward-compatible flat keys for older scripts. New code should prefer sections above.
titles:
  - senior software engineer
  - backend developer
locations:
  - london
  - manchester
proximity: 50
delay_seconds: 2
crawl_full_job_pages: false
top_n_full_pages: 30
