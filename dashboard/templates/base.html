<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Newsroom{% endblock %}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: Canvas;
    --fg: CanvasText;
    --muted: color-mix(in srgb, CanvasText 55%, Canvas);
    --line: color-mix(in srgb, CanvasText 18%, Canvas);
    --panel: color-mix(in srgb, CanvasText 4%, Canvas);
    --good: #128a2e;
    --warn: #b36b00;
    --bad: #b00020;
  }
  @media (prefers-color-scheme: dark) {
    :root { --good: #4ad66d; --warn: #ffb84d; --bad: #ff6b81; }
  }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; background: var(--bg); color: var(--fg);
  }
  header {
    border-bottom: 1px solid var(--line); padding: 14px 24px;
    display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap;
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 16px; }
  nav a:hover, nav a.on { color: var(--fg); }
  main { padding: 24px; max-width: 1200px; }
  h2 { font-size: 0.95rem; margin: 28px 0 10px; font-weight: 650; }
  h2:first-child { margin-top: 0; }
  .muted { color: var(--muted); }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .tile {
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 15px; min-width: 104px;
    background: var(--panel);
  }
  .tile b { display: block; font-size: 1.5rem; font-weight: 620; line-height: 1.15; }
  .tile span { color: var(--muted); font-size: 0.8rem; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 550; white-space: nowrap; }
  tbody tr:hover { background: var(--panel); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  code { font-size: 12px; }
  .good { color: var(--good); }
  .warn { color: var(--warn); }
  .bad  { color: var(--bad); }
  .never { color: var(--muted); font-style: italic; }
  .scroll { overflow-x: auto; }
  a { color: inherit; }
  tbody a { text-decoration: none; }
  tbody a:hover { text-decoration: underline; }
  .filters {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); margin-bottom: 12px;
  }
  .filters input, .filters select, .filters button {
    font: inherit; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .filters button { cursor: pointer; font-weight: 550; }
  .filters label { color: var(--muted); font-size: 13px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <h1>Job Newsroom</h1>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'home' }}">Overview</a>
    <a href="/jobs" class="{{ 'on' if nav == 'jobs' }}">Jobs</a>
    <a href="/runs" class="{{ 'on' if nav == 'runs' }}">Runs</a>
    <a href="/schedule" class="{{ 'on' if nav == 'schedule' }}">Schedule</a>
    <a href="/ingest" class="{{ 'on' if nav == 'ingest' }}">Ingest</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
