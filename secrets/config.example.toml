# himalaya's configuration inside the container.
#
# Copy to secrets/config.toml and fill in your address. The compose file mounts ./secrets at
# /run/himalaya read-only and points HIMALAYA_CONFIG at this file.
#
# The difference from a Mac config is the password: natively himalaya reads the login keychain
# (`security find-generic-password`), which needs an unlocked GUI session and does not exist in
# a Linux container. Here it reads a file you place beside this one.
#
#   printf '%s' 'your-16-char-app-password' > secrets/password
#   chmod 600 secrets/password
#
# That app password is full IMAP and SMTP access to the whole account — not scoped to the job
# labels. Both files are gitignored. Revoke it at myaccount.google.com if this machine is ever
# shared or exposed.

[accounts.gmail]
default = true
email = "YOUR_ADDRESS@gmail.com"

backend.type = "imap"
backend.host = "imap.gmail.com"
backend.port = 993
backend.encryption.type = "tls"
backend.login = "YOUR_ADDRESS@gmail.com"
backend.auth.type = "password"
backend.auth.cmd = "cat /run/himalaya/password"

folder.aliases.inbox = "INBOX"
folder.aliases.sent = "[Gmail]/Sent Mail"
folder.aliases.drafts = "[Gmail]/Drafts"
folder.aliases.trash = "[Gmail]/Trash"
